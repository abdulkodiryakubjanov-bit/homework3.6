<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мини-приложение Время</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Мини-приложение «Время»</h1>
    <p id="greeting"></p>

    <section class="block">
      <h2>Часы</h2>
      <div id="clock" class="digits">00:00:00</div>
      <div id="date"></div>
    </section>



    <section class="block">
      <h2>Секундомер</h2>
      <div id="stopwatch" class="digits">00:00.0</div>
      <button id="swStart">Старт</button>
      <button id="swStop">Стоп</button>
      <button id="swLap">Круг</button>
      <button id="swReset">Сброс</button>
      <ul id="lapsList" class="laps"></ul>
    </section>


    <section class="block">
      <h2>Таймер</h2>
      <input id="timerInput" type="number" min="1" value="10"> сек.
      <div class="buttons"><button id="timerStart">Старт</button>
      <button id="timerStop">Стоп</button>
      <button id="timercontinue">Продолжить</button>
      <button id="timerReset">Сброс</button></div>
      <div id="timerView" class="digits">00:10</div>
      <p id="timerMsg"></p>
    </section>



    <section class="block">
     <p id="newYear" class="accent-text"></p>
  </section>
  </div>
  
  <script src="main.js"></script>
</body>
</html>
